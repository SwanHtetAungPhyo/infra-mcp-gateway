name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Scanner versions are pinned, and the Trivy download is checked against its
# published SHA-256, because this repo runs these binaries on real targets.
env:
  TRIVY_VERSION: "0.69.3"
  TRIVY_SHA256: "1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75"
  NMAP_FORMATTER_VERSION: "v3.1.5"

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Install scanners (nmap, nmap-formatter, trivy)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nmap
          go install "github.com/vdjagilev/nmap-formatter/v3@${NMAP_FORMATTER_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          curl -sSfL -o /tmp/trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/trivy.tgz -C /usr/local/bin trivy

      - name: Show tool versions
        run: |
          go version
          nmap --version | head -1
          trivy --version | head -1
          command -v nmap-formatter

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build -o bin/runner ./cmd

      - name: Test
        env:
          TRIVY_NETWORK_TESTS: "1" # also clone a small public repo for the repo-scan test
        run: go test -race -count=1 ./...

  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: govulncheck (reachable Go vulnerabilities)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Install trivy
        run: |
          curl -sSfL -o /tmp/trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/trivy.tgz -C /usr/local/bin trivy

      - name: Trivy self-scan (dependencies, secrets, misconfigurations)
        run: |
          trivy fs --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .
